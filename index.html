<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบตรวจสอบผลการเรียนออนไลน์</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #333;
    }

    header {
      background: linear-gradient(to right, #4b0082, #7b2cbf);
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h2 {
      color: #4b0082;
    }

    input, button {
      padding: 12px;
      margin: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    input {
      width: 200px;
    }

    button {
      background: #7b2cbf;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #5a189a;
    }

    .danger {
      background: #d90429;
    }

    .edit {
      background: #2a9d8f;
    }

    .hidden {
      display: none;
    }

    .student-info {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
    }

    .rank {
      font-size: 22px;
      font-weight: bold;
      color: #7b2cbf;
    }

    .low-gpa {
      color: red;
      font-weight: bold;
    }

    .high-gpa {
      color: green;
      font-weight: bold;
    }

    .status-pass {
      color: green;
      font-weight: bold;
    }

    .status-warning {
      color: orange;
      font-weight: bold;
    }

    .status-fail {
      color: red;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th {
      background: #7b2cbf;
      color: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    .progress-bar {
      width: 100%;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
      height: 18px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(to right, #7b2cbf, #9d4edd);
      color: white;
      font-size: 12px;
      line-height: 18px;
    }

    .spinner {
      border: 5px solid #eee;
      border-top: 5px solid #7b2cbf;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    @media(max-width:768px) {
      table, thead, tbody, th, td, tr {
        display: block;
        width: 100%;
      }

      th {
        display: none;
      }

      tr {
        background: white;
        margin-bottom: 15px;
        border-radius: 10px;
        padding: 10px;
      }

      td {
        border: none;
        text-align: left;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>ระบบตรวจสอบผลการเรียนออนไลน์</h1>
  <p>International Center for Excellence</p>
</header>

<div class="container">

  <div class="card">
    <h2>เข้าสู่ระบบแอดมิน</h2>

    <input type="password" id="adminPass" placeholder="รหัสผ่านแอดมิน">
    <button onclick="loginAdmin()">เข้าสู่ระบบ</button>

    <div id="adminPanel" class="hidden">
      <h2>จัดการนักเรียน</h2>

      <input type="text" id="liveSearch" placeholder="ค้นหาชื่อ..." onkeyup="searchStudent()">
      <br>

      <input type="text" id="studentCode" placeholder="รหัสนักเรียน">
      <input type="text" id="studentName" placeholder="ชื่อนักเรียน">
      <input type="date" id="studentBirth">

      <button onclick="addStudent()">เพิ่มนักเรียน</button>
      <button onclick="exportCSV()">ดาวน์โหลด CSV</button>
      <button onclick="window.print()">ดาวน์โหลด PDF</button>

      <table id="studentTable">
        <thead>
          <tr>
            <th>รหัส</th>
            <th>ชื่อ</th>
            <th>GPA</th>
            <th>อันดับ</th>
            <th>สถานะ</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>ตรวจสอบผลการเรียน</h2>

    <input type="text" id="searchCode" placeholder="รหัสนักเรียน">
    <input type="date" id="searchBirth">
    <button onclick="checkGrade()">ดูผลการเรียน</button>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
    </div>

    <div id="resultBox"></div>
  </div>

</div>

<script>
const adminPassword = "admin123";

let students = [
  {
    code: "S001",
    name: "มายู",
    birth: "2012-08-21",
    grades: {
      "ไทย": 4,
      "คณิต": 3.5,
      "วิทยาศาสตร์": 4,
      "อังกฤษ": 3.5
    }
  },
  {
    code: "S002",
    name: "เถิด",
    birth: "2012-05-10",
    grades: {
      "ไทย": 2,
      "คณิต": 2.5,
      "วิทยาศาสตร์": 2,
      "อังกฤษ": 2
    }
  },
  {
    code: "S003",
    name: "อามี่",
    birth: "2012-02-14",
    grades: {
      "ไทย": 4,
      "คณิต": 4,
      "วิทยาศาสตร์": 4,
      "อังกฤษ": 4
    }
  },
  {
    code: "S004",
    name: "จีโน่",
    birth: "2012-11-30",
    grades: {
      "ไทย": 1,
      "คณิต": 1.5,
      "วิทยาศาสตร์": 1,
      "อังกฤษ": 1
    }
  }
];

function loadData() {
  const saved = localStorage.getItem("students");
  if (saved) {
    students = JSON.parse(saved);
  }
}

function saveData() {
  localStorage.setItem("students", JSON.stringify(students));
}

function calculateGPA(student) {
  const grades = Object.values(student.grades);
  const total = grades.reduce((a, b) => a + b, 0);
  return (total / grades.length).toFixed(2);
}

function getStatus(gpa) {
  if (gpa >= 2) {
    return '<span class="status-pass">ผ่าน</span>';
  } else if (gpa >= 1) {
    return '<span class="status-warning">ติด ร</span>';
  } else {
    return '<span class="status-fail">มส</span>';
  }
}

function updateRanks() {
  students.forEach(student => {
    student.gpa = calculateGPA(student);
  });

  students.sort((a, b) => b.gpa - a.gpa);

  students.forEach((student, index) => {
    student.rank = index + 1;
  });

  updateTable();
  saveData();
}

function updateTable() {
  const tbody = document.querySelector("#studentTable tbody");
  tbody.innerHTML = "";

  students.forEach((student, index) => {
    let gpaClass = "";

    if (student.gpa < 2) {
      gpaClass = "low-gpa";
    } else if (student.gpa >= 3.5) {
      gpaClass = "high-gpa";
    }

    tbody.innerHTML += `
      <tr>
        <td>${student.code}</td>
        <td>${student.name}</td>
        <td class="${gpaClass}">
          ${student.gpa} ${student.gpa >= 3.5 ? "🏅" : ""}
        </td>
        <td>${student.rank}</td>
        <td>${getStatus(student.gpa)}</td>
        <td>
          <button class="edit" onclick="editStudent(${index})">แก้ไข</button>
          <button class="danger" onclick="deleteStudent(${index})">ลบ</button>
        </td>
      </tr>
    `;
  });
}

function loginAdmin() {
  const pass = document.getElementById("adminPass").value;

  if (pass === adminPassword) {
    document.getElementById("adminPanel").classList.remove("hidden");
    alert("เข้าสู่ระบบสำเร็จ");
  } else {
    alert("รหัสผ่านไม่ถูกต้อง");
  }
}

function addStudent() {
  const code = document.getElementById("studentCode").value.trim();
  const name = document.getElementById("studentName").value.trim();
  const birth = document.getElementById("studentBirth").value;

  if (!code || !name || !birth) {
    alert("กรุณากรอกข้อมูลให้ครบ");
    return;
  }

  students.push({
    code,
    name,
    birth,
    grades: {
      "ไทย": 0,
      "คณิต": 0,
      "วิทยาศาสตร์": 0,
      "อังกฤษ": 0
    }
  });

  updateRanks();
}

function editStudent(index) {
  const student = students[index];

  const newName = prompt("แก้ชื่อ", student.name);
  if (newName !== null) student.name = newName;

  for (let subject in student.grades) {
    const newGrade = prompt(`แก้เกรด ${subject}`, student.grades[subject]);
    if (newGrade !== null) {
      student.grades[subject] = parseFloat(newGrade) || 0;
    }
  }

  updateRanks();
}

function deleteStudent(index) {
  if (confirm("ต้องการลบนักเรียนหรือไม่")) {
    students.splice(index, 1);
    updateRanks();
  }
}

function searchStudent() {
  const keyword = document.getElementById("liveSearch").value.toLowerCase();
  const rows = document.querySelectorAll("#studentTable tbody tr");

  rows.forEach(row => {
    row.style.display = row.innerText.toLowerCase().includes(keyword) ? "" : "none";
  });
}

function exportCSV() {
  let csv = "รหัส,ชื่อ,GPA,อันดับ\n";

  students.forEach(student => {
    csv += `${student.code},${student.name},${student.gpa},${student.rank}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "students.csv";
  link.click();
}

function checkGrade() {
  document.getElementById("loading").classList.remove("hidden");

  setTimeout(() => {
    document.getElementById("loading").classList.add("hidden");

    const code = document.getElementById("searchCode").value.trim();
    const birth = document.getElementById("searchBirth").value;

    const student = students.find(s => s.code === code && s.birth === birth);

    if (!student) {
      document.getElementById("resultBox").innerHTML = `
        <div class="student-info">ไม่พบข้อมูลนักเรียน</div>
      `;
      return;
    }

    let gpaClass = "";

    if (student.gpa < 2) {
      gpaClass = "low-gpa";
    } else if (student.gpa >= 3.5) {
      gpaClass = "high-gpa";
    }

    let html = `
      <div class="student-info">
        <h3>${student.name}</h3>
        <p>รหัส: ${student.code}</p>
        <p class="rank ${gpaClass}">
          GPA: ${student.gpa} ${student.gpa >= 3.5 ? "🏅" : ""}
        </p>
        <p>${getStatus(student.gpa)}</p>

        <table>
          <tr>
            <th>วิชา</th>
            <th>เกรด</th>
            <th>คะแนน</th>
          </tr>
    `;

    for (let subject in student.grades) {
      const percent = (student.grades[subject] / 4) * 100;

      html += `
        <tr>
          <td>${subject}</td>
          <td>${student.grades[subject]}</td>
          <td>
            <div class="progress-bar">
              <div class="progress-fill" style="width:${percent}%">
                ${percent.toFixed(0)}%
              </div>
            </div>
          </td>
        </tr>
      `;
    }

    html += `</table></div>`;
    document.getElementById("resultBox").innerHTML = html;
  }, 1000);
}

loadData();
updateRanks();
</script>

</body>
</html>
