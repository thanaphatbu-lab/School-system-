<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบตรวจสอบผลการเรียน</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6fb;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .login-box, .dashboard {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    h1 {
      text-align: center;
      color: #5e35b1;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #5e35b1;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #4527a0;
    }

    .hidden {
      display: none;
    }

    .student-card {
      background: #fafafa;
      padding: 15px;
      border-radius: 15px;
      margin-top: 15px;
      border-left: 6px solid #5e35b1;
    }

    .low-gpa {
      color: red;
      font-weight: bold;
    }

    .high-gpa {
      color: green;
      font-weight: bold;
    }

    .status-pass {
      color: green;
      font-weight: bold;
    }

    .status-fail {
      color: red;
      font-weight: bold;
    }

    .subject {
      margin-top: 15px;
    }

    .bar {
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
      height: 20px;
    }

    .bar-fill {
      height: 100%;
      background: #5e35b1;
      text-align: right;
      color: white;
      padding-right: 8px;
      font-size: 12px;
      line-height: 20px;
    }

    #searchInput {
      margin-bottom: 15px;
    }

    .spinner {
      border: 5px solid #eee;
      border-top: 5px solid #5e35b1;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
      display: none;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    @media(max-width: 768px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }

      tr {
        background: white;
        margin-bottom: 15px;
        padding: 10px;
        border-radius: 15px;
      }

      td {
        padding: 8px 0;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="login-box" id="loginBox">
    <h1>ระบบตรวจสอบผลการเรียน</h1>
    <input type="text" id="studentId" placeholder="รหัสนักเรียน">
    <input type="date" id="birthDate">
    <button onclick="login()">เข้าสู่ระบบ</button>
  </div>

  <div class="spinner" id="spinner"></div>

  <div class="dashboard hidden" id="dashboard">
    <h1>ผลการเรียน</h1>

    <input type="text" id="searchInput" placeholder="ค้นหาชื่อนักเรียน..." onkeyup="searchStudent()">

    <div id="studentResult"></div>

    <button onclick="exportCSV()">Export CSV</button>
    <button onclick="window.print()">Export PDF</button>
  </div>
</div>

<script>
  const students = [
    {
      id: "S001",
      birth: "2012-08-21",
      name: "มายู",
      gpa: 3.82,
      status: "ผ่าน",
      subjects: [
        { name: "คณิตศาสตร์", score: 88 },
        { name: "วิทยาศาสตร์", score: 92 },
        { name: "ภาษาอังกฤษ", score: 95 }
      ]
    },
    {
      id: "S002",
      birth: "2012-05-10",
      name: "เถิด",
      gpa: 1.85,
      status: "มส",
      subjects: [
        { name: "คณิตศาสตร์", score: 45 },
        { name: "วิทยาศาสตร์", score: 50 },
        { name: "ภาษาอังกฤษ", score: 40 }
      ]
    },
    {
      id: "S003",
      birth: "2012-03-14",
      name: "อามี่",
      gpa: 3.20,
      status: "ผ่าน",
      subjects: [
        { name: "คณิตศาสตร์", score: 80 },
        { name: "วิทยาศาสตร์", score: 78 },
        { name: "ภาษาอังกฤษ", score: 85 }
      ]
    },
    {
      id: "S004",
      birth: "2012-11-02",
      name: "จีโน่",
      gpa: 2.10,
      status: "ร",
      subjects: [
        { name: "คณิตศาสตร์", score: 60 },
        { name: "วิทยาศาสตร์", score: 58 },
        { name: "ภาษาอังกฤษ", score: 62 }
      ]
    }
  ];

  localStorage.setItem("students", JSON.stringify(students));

  function login() {
    const id = document.getElementById("studentId").value;
    const birth = document.getElementById("birthDate").value;
    const studentData = JSON.parse(localStorage.getItem("students"));

    document.getElementById("spinner").style.display = "block";

    setTimeout(() => {
      document.getElementById("spinner").style.display = "none";

      const student = studentData.find(s => s.id === id && s.birth === birth);

      if(student) {
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        displayStudent(student);
      } else {
        alert("ไม่พบข้อมูลนักเรียน");
      }
    }, 1500);
  }

  function displayStudent(student) {
    const gpaClass = student.gpa < 2 ? "low-gpa" : "high-gpa";
    const medal = student.gpa > 3.5 ? "🏅" : "";
    const statusClass = student.status === "ผ่าน" ? "status-pass" : "status-fail";

    let html = `
      <div class="student-card">
        <h2>${student.name} ${medal}</h2>
        <p>รหัสนักเรียน: ${student.id}</p>
        <p class="${gpaClass}">GPA: ${student.gpa}</p>
        <p class="${statusClass}">สถานะ: ${student.status}</p>
    `;

    student.subjects.forEach(sub => {
      html += `
        <div class="subject">
          <p>${sub.name} - ${sub.score} คะแนน</p>
          <div class="bar">
            <div class="bar-fill" style="width:${sub.score}%">${sub.score}%</div>
          </div>
        </div>
      `;
    });

    html += `</div>`;
    document.getElementById("studentResult").innerHTML = html;
  }

  function searchStudent() {
    const input = document.getElementById("searchInput").value.toLowerCase();
    const studentData = JSON.parse(localStorage.getItem("students"));

    const found = studentData.find(s => s.name.toLowerCase().includes(input));

    if(found) {
      displayStudent(found);
    }
  }

  function exportCSV() {
    const studentData = JSON.parse(localStorage.getItem("students"));
    let csv = "ชื่อ,GPA,สถานะ\n";

    studentData.forEach(s => {
      csv += `${s.name},${s.gpa},${s.status}\n`;
    });

    const blob = new Blob([csv], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "students.csv";
    a.click();
  }
</script>

</body>
</html>
